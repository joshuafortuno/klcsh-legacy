<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — KLCSH Legacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0d08" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="logo">
        <span class="logo-cube" aria-hidden="true"></span>
        KLCSH Legacy
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="/">Home</a>
        <a href="/contributions">Contributions</a>
        <a href="/contributors">Contributors</a>
        <a href="/about">About</a>
      </nav>
      <div class="header-right">
        <div class="header-account" id="header-account"></div>
        <button type="button" class="nav-toggle-btn" id="nav-toggle-btn" aria-expanded="false" aria-controls="main-nav" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="admin-main wrap">
    <div class="admin-intro">
      <h1>Admin Dashboard</h1>
      <p>Where things stand right now.</p>
    </div>

    <div class="admin-nav-bar">
      <button type="button" class="admin-nav-toggle-btn" id="admin-nav-toggle-btn" aria-expanded="false" aria-controls="admin-nav" aria-label="Admin menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        Menu
      </button>
      <nav class="admin-nav" id="admin-nav">
      <a href="/admin/dashboard" class="active">Dashboard</a>
      <a href="/admin/contributions">Contributions</a>
      <a href="/admin/manage-contributions">Manage Contributions</a>
      <a href="/admin/manage-accounts">Manage Accounts</a>
      <a href="/admin/whitelist">Whitelist</a>
      <a href="/admin/notifications">Notifications</a>
    </nav>
    </div>

    <div class="admin-stats" id="admin-stats">
      <!-- filled by dashboard.js -->
    </div>

    <div class="admin-card">
      <h2>Recent activity</h2>
      <p class="admin-card-sub">The last admin actions taken, pulled straight from the audit log.</p>
      <div class="activity-feed" id="activity-feed">
        <!-- filled by dashboard.js -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-client.js"></script>
  <script src="/utils.js"></script>
  <script src="/pwa-register.js"></script>
  <script src="/auth-guard.js"></script>
  <script src="/admin/admin-guard.js"></script>
  <script src="/admin/dashboard.js"></script>
  <script>
    (async () => {
      const user = await requireAdmin();
      if (user) {
        renderAccountNav(user);
        loadDashboard();
      }
    })();
  </script>
</body>
</html>
