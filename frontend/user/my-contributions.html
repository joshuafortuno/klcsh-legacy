<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Contributions — KLCSH Legacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/account/auth.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="logo">
        <span class="logo-cube" aria-hidden="true"></span>
        KLCSH Legacy
      </a>
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/contributions">Contributions</a>
        <a href="/contributors">Contributors</a>
        <a href="/about">About</a>
      </nav>
      <div class="header-account" id="header-account"></div>
    </div>
  </header>

  <main class="auth-main">
    <div class="narrow-wrap">

      <div class="page-intro">
        <p class="eyebrow">Your history</p>
        <h1>My Contributions</h1>
        <p class="hero-sub">Every submission you've ever made, whatever happened to it.</p>
      </div>

      <div class="auth-card">
        <div class="inline-form">
          <div class="field">
            <label for="my-status-filter">Status</label>
            <select id="my-status-filter">
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>

        <div class="ledger" id="my-contributions-list"></div>
        <div id="my-contributions-empty"></div>
        <div class="ledger-pagination">
          <button type="button" class="btn-ghost" id="my-contributions-prev-page">Previous</button>
          <button type="button" class="btn-ghost" id="my-contributions-next-page">Next</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>KLCSH Legacy is community-run and community-funded.</p>
      <div class="footer-social">
        <a href="#" class="social-icon" aria-label="Join our Discord" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.673-3.548-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        </a>
        <a href="#" class="social-icon" aria-label="Follow us on Facebook" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.505 17.523 2 12 2S2 6.505 2 12.06c0 5.02 3.657 9.184 8.438 9.94v-7.03H7.898v-2.91h2.54V9.845c0-2.507 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562v1.878h2.773l-.443 2.91h-2.33V22c4.78-.756 8.437-4.92 8.437-9.94z"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-client.js"></script>
  <script src="/auth-guard.js"></script>
  <script src="/user/my-contributions.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (user) {
        renderAccountNav(user);
        loadMyContributions(user);
      }
    })();
  </script>
</body>
</html>
